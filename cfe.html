<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Inicio de Sesión - CFE</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tus estilos -->
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <!-- Fondo con imagen -->
  <section class="principal">

    <!-- Contenido centrado -->
    <div class="contenido d-flex flex-column align-items-center text-center">
      
      <!-- Logo con sombra animada -->
      <img src="src/logo_cfe.png" alt="Logo CFE" class="logo-sombra mb-3">

      <!-- Títulos -->
      <h1 class="titulo">CFE - Siempre contigo</h1>
      <p class="subtitulo mb-4">Usuarios Registrados</p>

      <!-- Formulario de inicio de sesión -->
      <div class="formulario">
        <h4 class="mb-3">Iniciar sesión</h4>
        <form id="formLogin">
          <div class="mb-3">
            <input type="text" class="form-control" id="usuario" placeholder="Usuario" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
          </div>
          <button type="submit" class="btn-luz w-100 py-2">Ingresar</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script de login -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const formLogin = document.getElementById('formLogin');

      formLogin.addEventListener('submit', function(e) {
        e.preventDefault();

        const usuario = document.getElementById('usuario').value.trim();
        const password = document.getElementById('password').value.trim();

        if (usuario === "paco" && password === "1234") {
          localStorage.setItem('usuarioActivo', JSON.stringify({ nombre: usuario }));
          window.location.href = "menu.html";
        } else {
          alert("Usuario o contraseña incorrectos. Intenta de nuevo.");
        }
      });
    });
  </script>
</body>
</html>
